plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'com.example.gazo'
version = '1.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

dependencies {
    implementation('org.cryptomator:cryptofs:2.6.4')
    implementation('commons-io:commons-io:2.16.1')
    runtimeOnly('org.slf4j:slf4j-simple:2.0.9')
    testImplementation('org.junit.jupiter:junit-jupiter:5.10.3')
}

javafx {
    version = '21.0.4'
    modules = ['javafx.controls', 'javafx.graphics', 'javafx.media']
}

application {
    mainClass = 'com.example.gazo.GazoApp'
}

run {
    // JavaFX + 大量画像で既定ヒープを超えやすいため
    minHeapSize = '256m'
    maxHeapSize = '2g'
}

def appName = 'Gazo'
def appVersion = project.version.toString()
def appIconPath = file('packaging/windows/app-icon.ico')

tasks.register('fatJar', Jar) {
    group = 'build'
    description = 'Assembles an executable JAR with dependencies.'
    archiveClassifier.set('all')
    manifest {
        attributes 'Main-Class': application.mainClass.get()
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(sourceSets.main.output)
    dependsOn(configurations.runtimeClasspath)
    from {
        configurations.runtimeClasspath
                .findAll { it.name.endsWith('jar') }
                .collect { zipTree(it) }
    }
}

tasks.register('jpackageWin') {
    group = 'distribution'
    description = 'Builds a Windows app image with jpackage.'
    dependsOn(tasks.named('fatJar'))

    doLast {
        def osName = System.getProperty('os.name', '').toLowerCase()
        if (!osName.contains('win')) {
            throw new GradleException('jpackageWin can only run on Windows.')
        }

        def jpackageExe = "${System.getProperty('java.home')}\\bin\\jpackage.exe"
        if (!file(jpackageExe).exists()) {
            throw new GradleException("jpackage.exe not found: ${jpackageExe}")
        }

        def inputDir = file("$buildDir/libs")
        def outputDir = file("$buildDir/jpackage")
        outputDir.mkdirs()
        if (!appIconPath.exists()) {
            throw new GradleException("Icon file not found: ${appIconPath}. Place a Windows .ico at packaging/windows/app-icon.ico")
        }

        def jarName = tasks.named('fatJar', Jar).get().archiveFileName.get()
        exec {
            commandLine(
                    jpackageExe,
                    '--type', 'app-image',
                    '--name', appName,
                    '--app-version', appVersion,
                    '--input', inputDir.absolutePath,
                    '--main-jar', jarName,
                    '--main-class', application.mainClass.get(),
                    '--icon', appIconPath.absolutePath,
                    '--dest', outputDir.absolutePath
            )
        }
    }
}

test {
    useJUnitPlatform()
}