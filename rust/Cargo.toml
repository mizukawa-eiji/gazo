[workspace]
resolver = "2"
members = ["crates/gazo-core", "crates/gazo-cli", "crates/gazo-webdav", "crates/gazo-gui"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MPL-2.0"

[workspace.dependencies]
# Cryptomator Vault Format 8 互換の暗号ライブラリ。再現性のためコミット固定。
oxcrypt-core = { git = "https://github.com/agucova/oxcrypt", rev = "397e30a84709f64752fda84ffdbfcbef2c298217" }
anyhow = "1"
thiserror = "2"
image = "0.25"
clap = { version = "4", features = ["derive"] }
rpassword = "7"
tempfile = "3"
# 新規 Vault の vault.cryptomator(JWT) を Java/Cryptomator 標準の kid で自前署名するため。
# jsonwebtoken は oxcrypt-core と同一メジャー(10)に合わせ EncodingKey 型を一致させる。
jsonwebtoken = "10"
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
# WebDAV クライアント用。native-tls を避け rustls を使う。
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
quick-xml = "0.37"
percent-encoding = "2"
sha2 = "0.10"
gazo-webdav = { path = "crates/gazo-webdav" }
slint = "1"
slint-build = "1"
log = "0.4"
